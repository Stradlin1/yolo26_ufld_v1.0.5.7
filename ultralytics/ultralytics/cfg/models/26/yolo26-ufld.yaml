# YOLO26-UFLD Lane Detection model
# Single-task lane detection using UFLDHead coordinate regression on P3 feature map.
# Based on yolo26n backbone/neck, replacing Detect with UFLDHead.

# Parameters
nc: 1 # number of classes (lane only)
num_rows: 4 # number of row anchors
row_anchors: [1.0, 0.89, 0.78, 0.67] # fixed y-positions (top-to-bottom, normalized 0~1)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024] # YOLO26s-UFLD summary: ~10M params

# Backbone — identical to yolo26.yaml
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# Neck (upsample only) → UFLDHead
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  # UFLDHead: P3 → [B, 4] normalized x-coordinates
  - [[16], 1, UFLDHead, [nc, num_rows, row_anchors]] # 17
