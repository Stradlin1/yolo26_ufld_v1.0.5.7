# YOLO26-UFLD Lane Detection — 56-row, P2 spatial softmax
# y anchors: 0.67 → 1.0, step 0.006
# Feature: P2 (stride 4, 160×160) → 4 px/cell

# Parameters
nc: 1
num_rows: 56
row_anchors: [0.67, 0.676, 0.682, 0.688, 0.694, 0.7, 0.706, 0.712, 0.718, 0.724, 0.73, 0.736, 0.742, 0.748, 0.754, 0.76, 0.766, 0.772, 0.778, 0.784, 0.79, 0.796, 0.802, 0.808, 0.814, 0.82, 0.826, 0.832, 0.838, 0.844, 0.85, 0.856, 0.862, 0.868, 0.874, 0.88, 0.886, 0.892, 0.898, 0.904, 0.91, 0.916, 0.922, 0.928, 0.934, 0.94, 0.946, 0.952, 0.958, 0.964, 0.97, 0.976, 0.982, 0.988, 0.994, 1.0]
scale: s  # default to 's' scale
scales: 
  s: [0.50, 0.50, 1024]

backbone:
  # 0
  - [-1, 1, Conv, [64, 3, 2]]           # stride 2
  # 1
  - [-1, 1, Conv, [128, 3, 2]]          # stride 4
  # 2  ← P2 (160×160, 128ch @ scale=s)
  - [-1, 2, C3k2, [256, False, 0.25]]
  # 3
  - [-1, 1, Conv, [256, 3, 2]]          # stride 8
  # 4  ← P3 (80×80)
  - [-1, 2, C3k2, [512, False, 0.25]]
  # 5
  - [-1, 1, Conv, [512, 3, 2]]          # stride 16
  # 6  ← P4 (40×40)
  - [-1, 2, C3k2, [512, True]]
  # 7
  - [-1, 1, Conv, [1024, 3, 2]]         # stride 32
  # 8  ← P5 (20×20)
  - [-1, 2, C3k2, [1024, True]]
  # 9
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  # 10
  - [-1, 2, C2PSA, [1024]]

head:
  # 11: P5 → upsample
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  # 12: concat with P4 (layer 6)
  - [[-1, 6], 1, Concat, [1]]
  # 13: P4_out
  - [-1, 2, C3k2, [512, True]]

  # 14: P4_out → upsample
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  # 15: concat with P3 (layer 4)
  - [[-1, 4], 1, Concat, [1]]
  # 16: P3_out (80×80)
  - [-1, 2, C3k2, [256, True]]

  # 17: P3_out → upsample to P2 size
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  # 18: concat with P2 (layer 2)
  - [[-1, 2], 1, Concat, [1]]
  # 19: P2_out (160×160, 4px/cell)
  - [-1, 2, C3k2, [128, True]]

  # 20: UFLDHead on P2
  - [[19], 1, UFLDHead, [nc, num_rows, row_anchors]]
